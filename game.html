<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#101c2c;color:#fff4d0;font:16px system-ui}main{max-width:1000px;margin:auto;padding:20px}h1{font-size:clamp(28px,5vw,48px);margin:5px 0;color:#f4f7b3}p{line-height:1.5}button{background:#e9f3ad;color:#233c35;border:0;border-radius:18px;padding:12px 18px;font-weight:700;cursor:pointer;margin:4px}button:disabled{opacity:.4;cursor:default}button:hover:not(:disabled){background:#fff5cb}nav{display:flex;flex-wrap:wrap}section{background:#203b40;border:1px solid #46645b;border-radius:22px;padding:16px;margin:12px 0}canvas{width:100%;display:block;border-radius:18px;touch-action:manipulation}#hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}#feedback{min-height:48px;color:#f7e6a8}label{display:inline-block;margin:8px}input{accent-color:#d8eb91}small{color:#c0d7ca}#controls{display:none}#choices{display:flex;flex-wrap:wrap} .tag{color:#c9e7b0;font-size:12px;letter-spacing:2px} </style><main><div class="tag">✦ A COZY LEARNING ADVENTURE ✦</div><h1>✨ Firefly Quest</h1><p>Help Lumi and friends find the lost glow!</p><nav id="nav"></nav><section><div id="hud"><b id="level"></b><b id="score"></b><b id="life"></b></div><h2 id="title"></h2><p id="story"></p><canvas id="world" width="900" height="460" aria-label="Animated firefly garden"></canvas><div id="choices"></div><p id="feedback" aria-live="polite"></p><button id="hint">💡 Hint</button><button id="retry">↻ Retry mission</button><button id="next">Next mission →</button><button id="restart">New adventure</button><div id="controls"><label>Fireflies <input id="pop" type="range" min="5" max="35" value="15"><span id="pv"></span></label><label>Randomness α <input id="alpha" type="range" min="0" max="0.5" step="0.01" value="0.15"><span id="av"></span></label><label>Attraction β₀ <input id="beta" type="range" min="0" max="1" step="0.05" value="0.8"><span id="bv"></span></label><label>Absorption γ <input id="gamma" type="range" min="0" max="15" step="0.5" value="2"><span id="gv"></span></label><div><button id="run">▶ Start</button><button id="pause">Ⅱ Pause</button><button id="step">Next iteration</button><button id="reset">Reset swarm</button></div><p id="stats"></p><canvas id="chart" width="900" height="120"></canvas></div></section><section><b>📖 Lumi's learning journal</b><p id="lesson"></p><small>Learning model: Yang, Firefly Algorithms for Multimodal Optimization (2010). <a style="color:#e9f3ad" href="https://arxiv.org/abs/1003.1466" target="_blank">Read paper ↗</a>. Mission values and customer estimates are illustrative.</small></section></main><script>
const $=id=>document.getElementById(id), c=$('world'),g=c.getContext('2d'), W=900,H=460;
let level=0,unlocked=0,points=0,earned=new Set(),life=3,done=false,flies=[],particles=[],running=false,iter=0,history=[],best=0,last=0,explored=0;
const missions=[['Find the Brightest Friend','Lumi: Tap the firefly with the highest brightness.','Brightness represents solution quality.','Compare the numbers. Higher is better in this maximization task.'],['Follow the Glow','Milo: Which equally bright friend attracts the little firefly more strongly?','Attraction decreases with distance when γ > 0.','Both friends have brightness 90. Choose the nearer one.'],['Explore the Unknown','Pixie: Our swarm is stuck on a small hill. Choose a way to explore new positions.','Randomness helps exploration but does not guarantee escape from local optima.','A nonzero random step can discover new positions.'],['Strawberry Stall Adventure','Find the stall location with the highest estimated customers per day.','Each location is a candidate solution. The objective is to maximize customers.','Compare the estimated customer counts.'],['Sandbox • Moonlit Garden','Experiment with the actual movement equation in a two-dimensional search space.','β = β₀ exp(−γr²). Movement combines attraction and a random step.','Try changing γ and α, then reset and compare best fitness.']];
function make(x,y,n,label=''){return{x,y,tx:x,ty:y,n,label}}
function nav(){ $('nav').replaceChildren();missions.forEach((m,i)=>{let b=document.createElement('button');b.textContent=i===4?'🧪 Sandbox':`${earned.has(i)?'⭐':i>unlocked?'🔒':'🌿'} Level ${i+1}`;b.disabled=i<4&&i>unlocked;b.onclick=()=>load(i);$('nav').append(b)})}
function hud(){ $('level').textContent=level===4?'🧪 SANDBOX':`LEVEL ${level+1} / 4`;$('score').textContent=`⭐ ${points} points`;$('life').textContent=level===4?'': '💗'.repeat(life)+'🤍'.repeat(3-life);$('next').disabled=!done||!earned.has(level)||level===4;nav()}
function load(i){level=i;life=3;done=false;running=false;particles=[];$('title').textContent=missions[i][0];$('story').textContent=missions[i][1];$('lesson').textContent=missions[i][2];$('feedback').textContent='🌙 Ready, explorer?';$('controls').style.display=i===4?'block':'none';$('next').textContent=i===3?'Open sandbox →':'Next mission →';$('choices').replaceChildren();if(i===0)flies=[make(140,170,25),make(350,100,95),make(650,160,60),make(250,320,45),make(690,320,75)];if(i===1)flies=[make(160,230,20,'You'),make(340,230,90,'Near'),make(760,230,90,'Far')];if(i===2){flies=[make(220,210,60),make(250,240,55),make(280,190,58)];choice('Stay still',()=>answer(false));choice('Explore randomly',()=>answer(true));choice('Ignore all solutions',()=>answer(false))}if(i===3)flies=[make(170,220,30,'Stall A'),make(450,160,100,'Stall B'),make(730,260,60,'Stall C')];if(i===4)resetSwarm();if([0,1,3].includes(i))flies.forEach((p,j)=>{if(i!==1||j>0)choice(`${p.label||'Firefly '+(j+1)} · ${p.n}`,()=>pick(j))});hud()}
function choice(s,fn){let b=document.createElement('button');b.textContent=s;b.onclick=fn;$('choices').append(b)}
function pick(j){if(level===0)answer(flies[j].n===95,j);if(level===1&&j>0)answer(j===1,j);if(level===3)answer(j===1,j)}
function answer(ok,j){if(done)return;if(!ok){life--;done=life===0;$('feedback').textContent=done?'🌙 Out of lives. Retry the mission!':'🌱 Not quite. Try again or use the hint.';hud();return}done=true;if(!earned.has(level)){earned.add(level);points+=(level+1)*100}unlocked=Math.max(unlocked,Math.min(3,level+1));let p=flies[j??0];if(level===2){flies.forEach((q,i)=>{q.tx=580+i*55;q.ty=150+i*40})}else flies.forEach((q,i)=>{if(i!==j&&(level!==1||i===0)){q.tx=p.x+(i-2)*35;q.ty=p.y+65}});particles=Array.from({length:70},()=>({x:p.x,y:p.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,a:1}));$('feedback').textContent='🎉 Mission complete! '+missions[level][2]+(earned.size===4?' 🏆 Firefly Master — all missions complete!':'');hud()}
$('hint').onclick=()=>{$('feedback').textContent='💡 '+missions[level][3]};$('retry').onclick=()=>load(level);$('next').onclick=()=>load(level+1);$('restart').onclick=()=>{earned.clear();points=0;unlocked=0;load(0)};
c.onclick=e=>{if(![0,1,3].includes(level))return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;let j=flies.findIndex(p=>Math.hypot(x-p.x,y-p.y)<55);if(j>=0)pick(j)};
const fit=(x,y)=>Math.max(.72*Math.exp(-((x-.25)**2+(y-.55)**2)/.035),Math.exp(-((x-.76)**2+(y-.28)**2)/.035));const clamp=x=>Math.max(.04,Math.min(.96,x));
function resetSwarm(){running=false;iter=0;flies=Array.from({length:+$('pop').value},()=>{let x=.05+Math.random()*.9,y=.08+Math.random()*.78;return make(x*W,y*H,100*fit(x,y))});best=Math.max(...flies.map(p=>p.n))/100;history=[best];stats()}
function step(){if(level!==4)return;let a=+$('alpha').value,b=+$('beta').value,k=+$('gamma').value;let old=flies.map(p=>({x:p.tx/W,y:p.ty/H,n:p.n}));flies.forEach((p,i)=>{let x=old[i].x,y=old[i].y;old.forEach(q=>{if(q.n>old[i].n){let dx=q.x-x,dy=q.y-y,B=b*Math.exp(-k*(dx*dx+dy*dy));x+=B*dx;y+=B*dy}});x=clamp(x+a*(Math.random()-.5));y=clamp(y+a*(Math.random()-.5));p.tx=x*W;p.ty=y*H;p.n=100*fit(x,y)});iter++;best=Math.max(best,...flies.map(p=>p.n/100));history.push(best);stats();if(iter>=300)running=false}
function stats(){ $('stats').textContent=`Iteration ${iter} · Best-ever fitness ${(best*100).toFixed(2)}% · Current best ${Math.max(...flies.map(p=>p.n)).toFixed(2)}%`;let h=$('chart').getContext('2d');h.clearRect(0,0,900,120);h.fillStyle='#142b30';h.fillRect(0,0,900,120);h.strokeStyle='#e7f5a1';h.lineWidth=3;h.beginPath();history.forEach((v,i)=>{let x=15+i*870/Math.max(1,history.length-1),y=105-v*90;i?h.lineTo(x,y):h.moveTo(x,y)});h.stroke();h.fillStyle='#fff4d0';h.font='12px system-ui';h.fillText('Best-ever fitness (0–1)',15,15)}
for(let [id,out] of [['pop','pv'],['alpha','av'],['beta','bv'],['gamma','gv']]){let update=()=>$(out).textContent=$(id).value;$(id).oninput=update;update()}$('pop').onchange=resetSwarm;$('run').onclick=()=>{if(iter<300)running=true};$('pause').onclick=()=>running=false;$('step').onclick=()=>{running=false;if(iter<300)step()};$('reset').onclick=resetSwarm;
function glow(x,y,r,color){let a=g.createRadialGradient(x,y,0,x,y,r);a.addColorStop(0,color);a.addColorStop(1,'#ffffff00');g.fillStyle=a;g.fillRect(x-r,y-r,r*2,r*2)}function ellipse(x,y,rx,ry,col,rot=0){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,rot,0,Math.PI*2);g.fill()}
function draw(t){if(running&&t-last>420){step();last=t}let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#171d40');bg.addColorStop(1,'#396b58');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let i=0;i<65;i++){g.globalAlpha=.25+.65*Math.sin(t/1000+i)**2;ellipse((i*137+17)%W,(i*73+19)%400,1.5,1.5,'#fff6cb')}g.globalAlpha=1;ellipse(820,55,30,30,'#fff0bc');ellipse(833,43,28,28,'#1c2946');if(level===4||level===2){glow(225,253,120,'#c7e38c55');glow(684,129,150,'#e8f6a477');g.fillStyle='#e8f6c7';g.font='15px system-ui';g.fillText('Local peak',185,100);g.fillText('Global peak',640,60)}g.fillStyle='#22483c';g.beginPath();g.moveTo(0,420);for(let x=0;x<=W;x+=10)g.lineTo(x,420+12*Math.sin(x/55));g.lineTo(W,H);g.lineTo(0,H);g.fill();g.font='30px serif';for(let i=0;i<19;i++)g.fillText(['🍄','🌷','🌿','🌼'][i%4],i*49,448+4*Math.sin(t/700+i));flies.forEach((p,i)=>{p.x+=(p.tx-p.x)*.07;p.y+=(p.ty-p.y)*.07;let x=p.x,y=p.y+Math.sin(t/450+i)*4;glow(x,y,30+p.n*.35,`rgba(250,255,145,${.15+p.n/150})`);g.save();g.translate(x,y);if(level===3){g.font='38px serif';g.textAlign='center';g.fillText('🍓',0,8)}else{for(let s of [-1,1])ellipse(s*16,-7,5+5*Math.abs(Math.sin(t/70+i)),14,'#d8efe2',s*.5);ellipse(0,9,13,16,p.n>70?'#fff39a':'#b4c88a');ellipse(0,-7,13,13,'#e6edb2');for(let s of [-1,1]){ellipse(s*5,-8,2.5,3.5,'#283b35');ellipse(s*9,-2,2.5,2,'#f2adb3')}g.strokeStyle='#283b35';g.beginPath();g.arc(0,-3,3,0,Math.PI);g.stroke()}if(level!==4||flies.length<20){g.fillStyle='#162f2c';g.fillRect(-44,27,88,25);g.fillStyle='#fff4d0';g.font='bold 13px system-ui';g.textAlign='center';g.fillText((p.label?p.label+' ':'')+Math.round(p.n),0,44)}g.restore()});particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a*=.98;g.globalAlpha=p.a;ellipse(p.x,p.y,3,3,'#fff1a1')});g.globalAlpha=1;requestAnimationFrame(draw)}load(0);requestAnimationFrame(draw);
</script></html>
